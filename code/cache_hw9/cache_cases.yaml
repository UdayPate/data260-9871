# DATA-260 HW9 Part 3.1 - labeled cache test set (SID4 9871, domain: community sports league fixtures)
# Written and committed BEFORE any threshold sweep. Labels are never edited after results; a labeling mistake
# would be documented separately (reports/hw09/LABEL_NOTES.md), not fixed here.
#
# How it is used: the 10 `seeds` are the queries already in the cache (each stored with its correct answer).
# Each of the 40 `cases` is then looked up against that cache:
#   expected: hit   -> the case should be served by the cache entry named in `matches` (and no other entry)
#   expected: miss  -> the case must NOT be served from the cache, because the correct answer differs / is unrelated
# A false hit = a case labeled `miss` that was served from the cache, or a `hit` case served by the wrong entry.
# For `different_answer` cases `differs_from` is the seed whose cached answer would be wrong; the correct answers
# differ in s9871_rel (checked by validate_cases.py, which uses no embeddings and no similarity).
# attribute: home_team | teams | home_ground | fixture_name | spots (what the question asks about the fixture)

seeds:
  - {id: S01, fixture: FX-9871-00005, attribute: home_team,    query: "Which team is the home team for fixture FX-9871-00005?"}
  - {id: S02, fixture: FX-9871-00006, attribute: teams,        query: "Who is playing in fixture FX-9871-00006?"}
  - {id: S03, fixture: FX-9871-00007, attribute: home_ground,  query: "What is the home ground for fixture FX-9871-00007?"}
  - {id: S04, fixture: FX-9871-00008, attribute: fixture_name, query: "What is the name of fixture FX-9871-00008?"}
  - {id: S05, fixture: FX-9871-00009, attribute: home_team,    query: "Which team is the home team for fixture FX-9871-00009?"}
