  - {id: C27, category: different_answer, expected: miss, differs_from: S07, fixture: FX-9871-00005, attribute: teams,        query: "Who is playing in fixture FX-9871-00005?"}
  - {id: C28, category: different_answer, expected: miss, differs_from: S08, fixture: FX-9871-00014, attribute: fixture_name, query: "What is the name of fixture FX-9871-00014?"}
