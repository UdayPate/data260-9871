  - {id: C05, category: exact_duplicate, expected: hit, matches: S05, query: "Which team is the home team for fixture FX-9871-00009?"}
  - {id: C06, category: exact_duplicate, expected: hit, matches: S06, query: "What is the home ground for fixture FX-9871-00010?"}
  - {id: C07, category: exact_duplicate, expected: hit, matches: S07, query: "Who is playing in fixture FX-9871-00011?"}
