  - {id: S07, fixture: FX-9871-00011, attribute: teams,        query: "Who is playing in fixture FX-9871-00011?"}
  - {id: S08, fixture: FX-9871-00012, attribute: fixture_name, query: "What is the name of fixture FX-9871-00012?"}
  - {id: S09, fixture: FX-9871-00013, attribute: spots,        query: "How many player spots are available for fixture FX-9871-00013?"}
  - {id: S10, fixture: FX-9871-00014, attribute: home_team,    query: "Which team is the home team for fixture FX-9871-00014?"}

cases:
