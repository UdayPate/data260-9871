<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HW2-Uday Patel</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <header class="masthead">
        <h1>Community Sports League Fixtures</h1>
        <div class="subtitle">The Weekly Fixture Gazette</div>
    </header>

    <!-- Create: classic form POST, server redirects back here on success -->
    <form id="fixtureForm" method="POST" action="/fixtures/create">
        <div class="field">
            <label for="fixtureName">Fixture Name</label>
            <input type="text" id="fixtureName" name="fixture_name"
                placeholder="e.g. Lions vs Tigers" required autofocus>
        </div>

        <div class="field">
            <label for="teamsPlayers">Teams / Players</label>
            <input type="text" id="teamsPlayers" name="teams_players"
                placeholder="e.g. Team Milpitas Lions vs Team San Jose Tigers roster" required>
        </div>

        <div class="field">
            <label for="submitterEmail">Your Email</label>
            <input type="email" id="submitterEmail" name="submitter_email"
                placeholder="e.g. captain@leaguemail.com" required>
        </div>

        <div class="field">
            <label for="description">Match Details</label>
            <textarea id="description" name="description"
                placeholder="Describe the match: rules, notes, special instructions..."
                required></textarea>
        </div>

        <div class="field">
            <label for="category">Sport Type</label>
            <select id="category" name="category">
                <option value="soccer">Soccer</option>
                <option value="basketball">Basketball</option>
                <option value="volleyball">Volleyball</option>
                <option value="cricket">Cricket</option>
            </select>
        </div>

        <div class="field checkbox-row">
            <input type="checkbox" id="agreeTerms" name="agree_terms">
            <label for="agreeTerms">I agree to the terms and conditions.</label>
        </div>

        <div class="field">
            <button type="submit">Submit Fixture</button>
        </div>
    </form>

    <!-- Fixed actions: one-click update-record-1 and delete-highest-id -->
    <div class="action-row">
        <form method="POST" action="/fixtures/update-first">
            <button type="submit" class="secondary-btn">Update Record #1</button>
        </form>
        <form method="POST" action="/fixtures/delete-highest">
            <button type="submit" class="secondary-btn danger-btn">Delete Highest ID</button>
        </form>
    </div>

    <section class="ledger">
        <h2>Fixture Board</h2>

        <div class="search-row">
            <input type="text" id="searchInput" placeholder="Search by fixture name or teams/players...">
            <button type="button" id="searchButton">Search</button>
            <button type="button" id="clearSearchButton">Clear</button>
        </div>

        <!-- UI states: JS toggles the "active" class on exactly one of these -->
        <div id="loadingState" class="state-box state-loading">
            Fetching the latest fixtures&hellip;
        </div>

        <div id="emptyState" class="state-box state-empty">
            No fixtures on the docket yet. Submit one above to get started.
        </div>

        <div id="errorState" class="state-box state-error">
            Wire report failed &mdash; unable to load fixtures. Please try again.
        </div>

        <table class="fixture-table" id="fixtureTable">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Fixture</th>
                    <th>Teams / Players</th>
                    <th>Sport</th>
                    <th>Submitted</th>
                </tr>
            </thead>
            <tbody id="fixtureTableBody">
                <!-- Populated dynamically by app.js via GET /api/fixtures -->
            </tbody>
        </table>
    </section>

    <script src="/static/app.js"></script>
</body>
</html>
