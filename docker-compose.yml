# HW8: single-node Kafka (official apache/kafka image, KRaft, no ZooKeeper) + worker + FastAPI.
# Containers talk to the broker on kafka:19092; the host (homework_demo.py) uses localhost:9092.
name: s9871
services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: s9871-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  # One-shot: creates the Part 1 and Part 2 topics on a fresh broker, then exits.
  kafka-init:
    image: apache/kafka:3.9.0
    container_name: s9871-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        for t in s9871_entity_requests s9871_entity_responses s9871_inbox s9871_drafts s9871_final s9871_dead_letter; do
          /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --topic $$t --partitions 1 --replication-factor 1 --bootstrap-server kafka:19092
        done
        # Part 2/3: two partitions so two Writer instances can share the work.
        /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --topic s9871_tasks --partitions 2 --replication-factor 1 --bootstrap-server kafka:19092

  worker:
    build:
      context: .
      dockerfile: code/kafka_hw8/Dockerfile
    container_name: s9871-worker
    command: ["python", "-u", "worker.py"]
    environment:
      KAFKA_BOOTSTRAP: kafka:19092
      TZ: America/Los_Angeles
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  api:
    build:
      context: .
      dockerfile: code/kafka_hw8/Dockerfile
    container_name: s9871-api
    command: ["python", "-u", "-m", "uvicorn", "api:app", "--host", "0.0.0.0", "--port", "8871"]
    environment:
      KAFKA_BOOTSTRAP: kafka:19092
      TZ: America/Los_Angeles
    ports:
      - "8871:8871"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
